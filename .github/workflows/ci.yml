name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Runner and workspace diagnostics
        run: |
          node --version
          npm --version
          test -f package.json
          test -f apps/backend/package.json
          test -f apps/frontend/package.json

      # A committed package-lock.json is not present yet. Until it is added,
      # npm install is used; G0 requires committing a lockfile and switching to npm ci.
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Backend unit tests
        run: npm test

      - name: Frontend production build
        run: npm run build:frontend
