name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "database/migrations/**"
      - "database/seeds/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "database/migrations/**"
      - "database/seeds/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Verify migration and transaction SQL invariants with SQLite
        run: python3 ../../scripts/verify_backend_sqlite.py
      - name: Apply migrations to isolated local D1
        run: npm run db:migrate:local
      - name: Load synthetic seed data
        run: npm run db:seed:local
