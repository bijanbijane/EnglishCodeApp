name: Backend CI

# Keep curriculum and assessment architecture changes in the backend validation path.

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "database/migrations/**"
      - "database/seeds/**"
      - "docs/curriculum/**"
      - "docs/architecture/ASSESSMENT-*.md"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "database/migrations/**"
      - "database/seeds/**"
      - "docs/curriculum/**"
      - "docs/architecture/ASSESSMENT-*.md"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Match the repository's declared packageManager instead of runner's floating npm.
      - run: npm install --global npm@10.9.2
      # npm 10's Arborist optional-peer resolver crashes with this Vitest graph;
      # required dependencies are validated by the audit, typecheck and test gates below.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - name: Verify migration and transaction SQL invariants with SQLite
        run: python3 ../../scripts/verify_backend_sqlite.py
      - name: Run Wrangler local D1 integration suite
        run: npm run test:d1-local
      - name: Smoke test the deployed development HTTP API
        working-directory: .
        run: node scripts/smoke_backend_dev.mjs
