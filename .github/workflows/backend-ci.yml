name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "database/migrations/**"
      - "database/seeds/**"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "database/migrations/**"
      - "database/seeds/**"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm to packageManager version
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - run: npm install --legacy-peer-deps
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - name: Verify migration and transaction SQL invariants with SQLite
        run: python3 ../../scripts/verify_backend_sqlite.py
      - name: Run Wrangler local D1 integration suite
        run: npm run test:d1-local
      - name: Smoke test the deployed development HTTP API
        working-directory: .
        run: node scripts/smoke_backend_dev.mjs
